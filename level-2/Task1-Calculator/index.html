<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <h2>Calculator</h2>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button data-action="clear" class="utility">C</button>
            <button data-action="delete" class="utility">⌫</button>
            <button data-operator="/" class="operator">÷</button>
            <button data-operator="*" class="operator">×</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button data-operator="-" class="operator">−</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button data-operator="+" class="operator">+</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button data-action="equals" class="equals">=</button>

            <button data-number="0" class="zero">0</button>
            <button data-action="decimal">.</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
